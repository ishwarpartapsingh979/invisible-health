name: Deploy Backend
on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
jobs:
  deploy_functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - id: 'auth'
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v1'
      - name: 'Deploy run-agent'
        run: |
          gcloud functions deploy run-agent \
            --gen2 \
            --runtime=python311 \
            --region=us-central1 \
            --source=./backend \
            --entry-point=run_agent \
            --trigger-http \
            --allow-unauthenticated \
            --set-env-vars "GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_KEY }},SUPABASE_URL=${{ secrets.SUPABASE_URL }},SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}"
