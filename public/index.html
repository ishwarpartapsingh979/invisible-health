<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Tracker - Ishwar, Jasmine & Uday</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .stat-box {
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .month-nav button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .month-nav button:hover {
            background: #5a67d8;
        }

        .month-nav button:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }

        .month-display {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 20px;
        }

        .day-header {
            text-align: center;
            font-weight: bold;
            color: #666;
            padding: 10px 0;
            font-size: 12px;
        }

        .day {
            aspect-ratio: 1;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
            background: white;
            font-weight: 500;
        }

        .day:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .day.today {
            border: 3px solid #667eea;
            font-weight: bold;
        }

        .day.green {
            background: #48bb78;
            color: white;
        }

        .day.yellow {
            background: #f6e05e;
            color: #333;
        }

        .day.red {
            background: #fc8181;
            color: white;
        }

        .day.has-exclamation::after {
            content: '⚠️';
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 12px;
        }

        .day.empty {
            border: none;
            cursor: default;
            background: transparent;
        }

        .day.empty:hover {
            transform: none;
            box-shadow: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            padding: 20px;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .person-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .person-name {
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            font-size: 16px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 16px;
            color: #555;
        }

        .checkbox-label input {
            width: 24px;
            height: 24px;
            margin-right: 10px;
            cursor: pointer;
        }

        .comment-container {
            margin-top: 10px;
            margin-left: 34px;
        }

        .comment-textarea {
            width: 100%;
            min-height: 60px;
            padding: 8px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            resize: vertical;
            font-family: inherit;
        }

        .comment-textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .media-buttons {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .media-btn {
            padding: 6px 12px;
            background: #f0f0f0;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .media-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .media-btn.recording {
            background: #fc8181;
            color: white;
            animation: pulse 1.5s infinite;
        }

        .media-btn.processing {
            background: #f6e05e;
            color: #333;
        }

        .media-status {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            font-style: italic;
        }

        .stored-media {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .stored-item {
            padding: 4px 8px;
            background: #e6fffa;
            border: 1px solid #81e6d9;
            border-radius: 4px;
            font-size: 12px;
            color: #234e52;
        }

        .today-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin: 0 auto;
            display: block;
        }

        .today-button:hover {
            background: #5a67d8;
        }

    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDjt1CJeKjMX0gf16q0ds5C2kClfTk2e_4",
            authDomain: "health-tracker-f8b66.firebaseapp.com",
            databaseURL: "https://health-tracker-f8b66-default-rtdb.firebaseio.com",
            projectId: "health-tracker-f8b66",
            storageBucket: "health-tracker-f8b66.firebasestorage.app",
            messagingSenderId: "869573272233",
            appId: "1:869573272233:web:fc979f61dae8e3f0d83fb8"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // State
        let currentDate = new Date();
        let currentMonth = new Date();
        let selectedDate = null;
        let healthData = {};

        // DOM Elements
        const calendar = document.getElementById('calendar');
        const modal = document.getElementById('modal');
        const modalDate = document.getElementById('modal-date');
        const closeModal = document.getElementById('close-modal');
        const prevMonthBtn = document.getElementById('prev-month');
        const nextMonthBtn = document.getElementById('next-month');
        const currentMonthDisplay = document.getElementById('current-month');
        const todayBtn = document.getElementById('today-btn');

        // Checkboxes
        const ishwarWorkout = document.getElementById('ishwar-workout');
        const ishwarFood = document.getElementById('ishwar-food');
        const jasmineWorkout = document.getElementById('jasmine-workout');
        const jasmineFood = document.getElementById('jasmine-food');
        const udayWorkout = document.getElementById('uday-workout');
        const udayFood = document.getElementById('uday-food');

        // Comment Textareas
        const ishwarWorkoutComment = document.getElementById('ishwar-workout-comment');
        const ishwarFoodComment = document.getElementById('ishwar-food-comment');
        const jasmineWorkoutComment = document.getElementById('jasmine-workout-comment');
        const jasmineFoodComment = document.getElementById('jasmine-food-comment');
        const udayWorkoutComment = document.getElementById('uday-workout-comment');
        const udayFoodComment = document.getElementById('uday-food-comment');

        // Stats
        const currentStreakEl = document.getElementById('current-streak');
        const monthScoreEl = document.getElementById('month-score');
        const bestStreakEl = document.getElementById('best-streak');

        // Initialize
        function init() {
            setupEventListeners();
            loadData();
            renderCalendar();
        }

        // Setup event listeners
        function setupEventListeners() {
            closeModal.addEventListener('click', () => {
                modal.classList.remove('show');
            });

            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('show');
                }
            });

            prevMonthBtn.addEventListener('click', () => {
                currentMonth.setMonth(currentMonth.getMonth() - 1);
                renderCalendar();
            });

            nextMonthBtn.addEventListener('click', () => {
                currentMonth.setMonth(currentMonth.getMonth() + 1);
                renderCalendar();
            });

            todayBtn.addEventListener('click', () => {
                currentMonth = new Date();
                renderCalendar();
            });

            // Checkbox listeners
            [ishwarWorkout, ishwarFood, jasmineWorkout, jasmineFood, udayWorkout, udayFood].forEach(checkbox => {
                checkbox.addEventListener('change', saveData);
            });

            // Textarea listeners
            [ishwarWorkoutComment, ishwarFoodComment, jasmineWorkoutComment,
             jasmineFoodComment, udayWorkoutComment, udayFoodComment].forEach(textarea => {
                textarea.addEventListener('blur', saveData);
            });

            // Media button listeners
            document.querySelectorAll('.media-btn').forEach(btn => {
                btn.addEventListener('click', handleMediaButton);
            });
        }

        // Load data from Firebase
        function loadData() {
            const dataRef = ref(database, 'healthData');
            onValue(dataRef, (snapshot) => {
                healthData = snapshot.val() || {};
                renderCalendar();
                updateStats();
            });
        }

        // Save data to Firebase
        async function saveData() {
            if (!selectedDate) return;

            const dateKey = formatDate(selectedDate);

            // Get existing data to preserve media fields
            const existingData = healthData[dateKey] || {};

            const data = {
                // Checkboxes
                ishwarWorkout: ishwarWorkout.checked,
                ishwarFood: ishwarFood.checked,
                jasmineWorkout: jasmineWorkout.checked,
                jasmineFood: jasmineFood.checked,
                udayWorkout: udayWorkout.checked,
                udayFood: udayFood.checked,

                // Text comments
                ishwarWorkoutComment: ishwarWorkoutComment.value || '',
                ishwarFoodComment: ishwarFoodComment.value || '',
                jasmineWorkoutComment: jasmineWorkoutComment.value || '',
                jasmineFoodComment: jasmineFoodComment.value || '',
                udayWorkoutComment: udayWorkoutComment.value || '',
                udayFoodComment: udayFoodComment.value || '',

                // Preserve existing media data
                ishwarWorkoutVoice: existingData.ishwarWorkoutVoice || '',
                ishwarWorkoutVoiceText: existingData.ishwarWorkoutVoiceText || '',
                ishwarWorkoutImage: existingData.ishwarWorkoutImage || '',
                ishwarWorkoutImageText: existingData.ishwarWorkoutImageText || '',

                ishwarFoodVoice: existingData.ishwarFoodVoice || '',
                ishwarFoodVoiceText: existingData.ishwarFoodVoiceText || '',
                ishwarFoodImage: existingData.ishwarFoodImage || '',
                ishwarFoodImageText: existingData.ishwarFoodImageText || '',

                jasmineWorkoutVoice: existingData.jasmineWorkoutVoice || '',
                jasmineWorkoutVoiceText: existingData.jasmineWorkoutVoiceText || '',
                jasmineWorkoutImage: existingData.jasmineWorkoutImage || '',
                jasmineWorkoutImageText: existingData.jasmineWorkoutImageText || '',

                jasmineFoodVoice: existingData.jasmineFoodVoice || '',
                jasmineFoodVoiceText: existingData.jasmineFoodVoiceText || '',
                jasmineFoodImage: existingData.jasmineFoodImage || '',
                jasmineFoodImageText: existingData.jasmineFoodImageText || '',

                udayWorkoutVoice: existingData.udayWorkoutVoice || '',
                udayWorkoutVoiceText: existingData.udayWorkoutVoiceText || '',
                udayWorkoutImage: existingData.udayWorkoutImage || '',
                udayWorkoutImageText: existingData.udayWorkoutImageText || '',

                udayFoodVoice: existingData.udayFoodVoice || '',
                udayFoodVoiceText: existingData.udayFoodVoiceText || '',
                udayFoodImage: existingData.udayFoodImage || '',
                udayFoodImageText: existingData.udayFoodImageText || '',

                timestamp: Date.now()
            };

            try {
                await set(ref(database, `healthData/${dateKey}`), data);
                // Update local cache
                healthData[dateKey] = data;
            } catch (error) {
                console.error('Error saving data:', error);
                alert('Error saving data. Please try again.');
            }
        }

        // Format date as YYYY-MM-DD
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Handle media button clicks
        async function handleMediaButton(e) {
            const btn = e.currentTarget;
            const person = btn.dataset.person;
            const type = btn.dataset.type;
            const action = btn.dataset.action;

            if (action === 'voice') {
                await handleVoiceRecording(person, type, btn);
            } else if (action === 'image') {
                await handleImageUpload(person, type, btn);
            }
        }

        // Handle voice recording
        async function handleVoiceRecording(person, type, btn) {
            const statusEl = document.getElementById(`${person}-${type}-status`);

            // Check if already recording
            if (btn.classList.contains('recording')) {
                // Stop recording
                stopVoiceRecording(person, type, btn);
                return;
            }

            try {
                // Start recording
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(stream);
                const audioChunks = [];

                btn.classList.add('recording');
                btn.querySelector('.btn-text').textContent = 'Stop';
                statusEl.textContent = '🔴 Recording...';

                // Store recorder reference
                btn.recordingData = { mediaRecorder, stream, audioChunks };

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await processVoiceRecording(person, type, audioBlob, statusEl);
                };

                mediaRecorder.start();

                // Auto-stop after 60 seconds
                setTimeout(() => {
                    if (btn.classList.contains('recording')) {
                        stopVoiceRecording(person, type, btn);
                    }
                }, 60000);

            } catch (error) {
                console.error('Microphone error:', error);
                statusEl.textContent = '❌ Microphone access denied';
            }
        }

        // Stop voice recording
        function stopVoiceRecording(person, type, btn) {
            if (btn.recordingData) {
                btn.recordingData.mediaRecorder.stop();
                btn.recordingData.stream.getTracks().forEach(track => track.stop());
                btn.recordingData = null;
            }
            btn.classList.remove('recording');
            btn.querySelector('.btn-text').textContent = 'Voice';
        }

        // Process voice recording
        async function processVoiceRecording(person, type, audioBlob, statusEl) {
            statusEl.textContent = '⏳ Processing audio...';

            // Convert to base64
            const base64Audio = await blobToBase64(audioBlob);

            // Send to transcribe endpoint
            try {
                const response = await fetch('http://localhost:8080/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        audio: base64Audio,
                        mime_type: 'audio/webm'
                    })
                });

                const result = await response.json();

                if (result.transcription) {
                    // Save to Firebase
                    await saveMediaData(person, type, 'Voice', base64Audio, result.transcription);
                    statusEl.textContent = '✅ Voice note saved';
                    updateStoredMediaIndicators(healthData[formatDate(selectedDate)]);
                } else {
                    statusEl.textContent = '❌ Transcription failed';
                }
            } catch (error) {
                console.error('Transcription error:', error);
                // Save without transcription
                await saveMediaData(person, type, 'Voice', base64Audio, 'Unable to transcribe');
                statusEl.textContent = '⚠️ Saved without transcription';
            }
        }

        // Handle image upload
        async function handleImageUpload(person, type, btn) {
            const statusEl = document.getElementById(`${person}-${type}-status`);

            // Create file input
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';

            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                statusEl.textContent = '⏳ Processing image...';
                btn.classList.add('processing');

                try {
                    const base64Image = await fileToBase64(file);

                    // Send to analyze endpoint
                    const response = await fetch('http://localhost:8080/analyze-image', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            image: base64Image,
                            mime_type: file.type
                        })
                    });

                    const result = await response.json();

                    if (result.description) {
                        // Save to Firebase
                        await saveMediaData(person, type, 'Image', base64Image, result.description);
                        statusEl.textContent = '✅ Image saved';
                        updateStoredMediaIndicators(healthData[formatDate(selectedDate)]);
                    } else {
                        statusEl.textContent = '❌ Image analysis failed';
                    }
                } catch (error) {
                    console.error('Image processing error:', error);
                    statusEl.textContent = '❌ Error processing image';
                } finally {
                    btn.classList.remove('processing');
                }
            };

            input.click();
        }

        // Save media data to Firebase
        async function saveMediaData(person, type, mediaType, mediaData, transcription) {
            const dateKey = formatDate(selectedDate);
            const existingData = healthData[dateKey] || {};

            const fieldPrefix = `${person}${type.charAt(0).toUpperCase() + type.slice(1)}`;

            if (mediaType === 'Voice') {
                existingData[`${fieldPrefix}Voice`] = mediaData;
                existingData[`${fieldPrefix}VoiceText`] = transcription;
            } else if (mediaType === 'Image') {
                existingData[`${fieldPrefix}Image`] = mediaData;
                existingData[`${fieldPrefix}ImageText`] = transcription;
            }

            // Merge with existing data and save
            healthData[dateKey] = existingData;
            await saveData();
        }

        // Update stored media indicators
        function updateStoredMediaIndicators(data) {
            if (!data) return;

            const people = ['ishwar', 'jasmine', 'uday'];
            const types = ['workout', 'food'];

            people.forEach(person => {
                types.forEach(type => {
                    const mediaEl = document.getElementById(`${person}-${type}-media`);
                    if (!mediaEl) return;

                    mediaEl.innerHTML = '';
                    const fieldPrefix = `${person}${type.charAt(0).toUpperCase() + type.slice(1)}`;

                    if (data[`${fieldPrefix}VoiceText`]) {
                        const voiceItem = document.createElement('div');
                        voiceItem.className = 'stored-item';
                        voiceItem.textContent = `🎤 ${data[`${fieldPrefix}VoiceText`].substring(0, 30)}...`;
                        voiceItem.title = data[`${fieldPrefix}VoiceText`];
                        mediaEl.appendChild(voiceItem);
                    }

                    if (data[`${fieldPrefix}ImageText`]) {
                        const imageItem = document.createElement('div');
                        imageItem.className = 'stored-item';
                        imageItem.textContent = `📷 ${data[`${fieldPrefix}ImageText`].substring(0, 30)}...`;
                        imageItem.title = data[`${fieldPrefix}ImageText`];
                        mediaEl.appendChild(imageItem);
                    }
                });
            });
        }

        // Convert blob to base64
        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        // Convert file to base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Get day status and color
        function getDayStatus(dateKey) {
            const data = healthData[dateKey];
            if (!data) return { color: '', hasExclamation: false };

            const ishwarComplete = data.ishwarWorkout && data.ishwarFood;
            const jasmineComplete = data.jasmineWorkout && data.jasmineFood;
            const udayComplete = data.udayWorkout && data.udayFood;

            const ishwarPartial = (data.ishwarWorkout || data.ishwarFood) && !(data.ishwarWorkout && data.ishwarFood);
            const jasminePartial = (data.jasmineWorkout || data.jasmineFood) && !(data.jasmineWorkout && data.jasmineFood);
            const udayPartial = (data.udayWorkout || data.udayFood) && !(data.udayWorkout && data.udayFood);

            const anyPartial = ishwarPartial || jasminePartial || udayPartial;
            const anyComplete = ishwarComplete || jasmineComplete || udayComplete;

            // Green only when all three complete both workout and food
            if (ishwarComplete && jasmineComplete && udayComplete) {
                return { color: 'green', hasExclamation: false };
            }
            // Yellow if at least one person completed, with exclamation if anyone partial
            else if (anyComplete) {
                return { color: 'yellow', hasExclamation: anyPartial };
            }
            // Red if no one completed, with exclamation if anyone partial
            else if (anyPartial) {
                return { color: 'red', hasExclamation: true };
            }
            // Red if nobody did anything
            else {
                return { color: 'red', hasExclamation: false };
            }
        }

        // Render calendar
        function renderCalendar() {
            // Clear calendar except headers
            const headers = calendar.querySelectorAll('.day-header');
            calendar.innerHTML = '';
            headers.forEach(header => calendar.appendChild(header));

            // Update month display
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                              'July', 'August', 'September', 'October', 'November', 'December'];
            currentMonthDisplay.textContent = `${monthNames[currentMonth.getMonth()]} ${currentMonth.getFullYear()}`;

            // Get first day of month and number of days
            const firstDay = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1);
            const lastDay = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0);
            const daysInMonth = lastDay.getDate();
            const startingDayOfWeek = firstDay.getDay();

            // Add empty cells for days before month starts
            for (let i = 0; i < startingDayOfWeek; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'day empty';
                calendar.appendChild(emptyDay);
            }

            // Add days of month
            for (let day = 1; day <= daysInMonth; day++) {
                const dayElement = document.createElement('div');
                dayElement.className = 'day';
                dayElement.textContent = day;

                const date = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), day);
                const dateKey = formatDate(date);
                const status = getDayStatus(dateKey);

                if (status.color) {
                    dayElement.classList.add(status.color);
                }
                if (status.hasExclamation) {
                    dayElement.classList.add('has-exclamation');
                }

                // Check if today
                const today = new Date();
                if (date.toDateString() === today.toDateString()) {
                    dayElement.classList.add('today');
                }

                // Add click handler
                dayElement.addEventListener('click', () => openModal(date));

                calendar.appendChild(dayElement);
            }

            // Update button states
            const today = new Date();
            const isCurrentMonth = currentMonth.getMonth() === today.getMonth() &&
                                  currentMonth.getFullYear() === today.getFullYear();
            todayBtn.style.display = isCurrentMonth ? 'none' : 'block';
        }

        // Open modal for a specific date
        function openModal(date) {
            selectedDate = date;
            const dateKey = formatDate(date);
            const data = healthData[dateKey] || {};

            // Update modal title
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            modalDate.textContent = date.toLocaleDateString('en-US', options);

            // Set checkbox values
            ishwarWorkout.checked = data.ishwarWorkout || false;
            ishwarFood.checked = data.ishwarFood || false;
            jasmineWorkout.checked = data.jasmineWorkout || false;
            jasmineFood.checked = data.jasmineFood || false;
            udayWorkout.checked = data.udayWorkout || false;
            udayFood.checked = data.udayFood || false;

            // Set comment values
            ishwarWorkoutComment.value = data.ishwarWorkoutComment || '';
            ishwarFoodComment.value = data.ishwarFoodComment || '';
            jasmineWorkoutComment.value = data.jasmineWorkoutComment || '';
            jasmineFoodComment.value = data.jasmineFoodComment || '';
            udayWorkoutComment.value = data.udayWorkoutComment || '';
            udayFoodComment.value = data.udayFoodComment || '';

            // Show stored media indicators
            updateStoredMediaIndicators(data);

            // Show modal
            modal.classList.add('show');
        }

        // Calculate current streak
        function calculateCurrentStreak() {
            let streak = 0;
            const today = new Date();
            let checkDate = new Date(today);

            // Check backwards from today
            while (true) {
                const dateKey = formatDate(checkDate);
                const status = getDayStatus(dateKey);

                // Only count green days for streak
                if (status.color === 'green') {
                    streak++;
                } else if (checkDate.toDateString() !== today.toDateString()) {
                    // If not today and not green, streak is broken
                    break;
                }

                // Move to previous day
                checkDate.setDate(checkDate.getDate() - 1);

                // Stop if we've gone back too far (max 365 days)
                if (streak > 365) break;
            }

            return streak;
        }

        // Calculate best streak
        function calculateBestStreak() {
            let bestStreak = 0;
            let currentStreak = 0;
            const sortedDates = Object.keys(healthData).sort();

            for (let i = 0; i < sortedDates.length; i++) {
                const status = getDayStatus(sortedDates[i]);

                if (status.color === 'green') {
                    currentStreak++;
                    bestStreak = Math.max(bestStreak, currentStreak);
                } else {
                    currentStreak = 0;
                }
            }

            return bestStreak;
        }

        // Calculate month score
        function calculateMonthScore() {
            const firstDay = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1);
            const lastDay = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0);
            const today = new Date();

            // Use today as the end date if we're in the current month
            const endDate = lastDay > today ? today : lastDay;

            let greenDays = 0;
            let totalDays = 0;

            for (let d = new Date(firstDay); d <= endDate; d.setDate(d.getDate() + 1)) {
                const dateKey = formatDate(d);
                const status = getDayStatus(dateKey);

                if (status.color === 'green') {
                    greenDays++;
                }
                totalDays++;
            }

            const percentage = totalDays > 0 ? Math.round((greenDays / totalDays) * 100) : 0;
            return `${percentage}%`;
        }

        // Update stats
        function updateStats() {
            currentStreakEl.textContent = calculateCurrentStreak();
            bestStreakEl.textContent = calculateBestStreak();
            monthScoreEl.textContent = calculateMonthScore();
        }

        // Start the app
        init();
    </script>
